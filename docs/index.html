<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="OpenAPI documentation for observed HTTP endpoints.">
    <title>GPT – OpenAPI / Swagger UI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.34.0/swagger-ui.css">
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *::before, *::after { box-sizing: inherit; }
        body { margin: 0; color: #202124; background: #fafafa; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .site-header { background: #fff; border-bottom: 1px solid #dadce0; }
        .site-header-inner { max-width: 1600px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
        .brand { color: #202124; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .site-nav { display: flex; flex-wrap: wrap; gap: 14px; }
        .site-nav a { color: #174ea6; text-decoration: none; font-size: 14px; }
        .site-nav a[aria-current="page"] { color: #202124; font-weight: 700; }
        #swagger-ui { max-width: 1600px; margin: 0 auto; }
        @media (max-width: 720px) { .site-header-inner { align-items: flex-start; flex-direction: column; gap: 10px; } .site-nav { gap: 10px 14px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="./index.html">GPT – API-Dokumentation</a>
            <nav class="site-nav" aria-label="Dokumentation">
                <a href="./index.html" aria-current="page">OpenAPI / Swagger UI</a>
                <a href="./asyncapi.html">AsyncAPI / Streams</a>
                <a href="./hooks.html">Browser-Hooks</a>
                <a href="./observations.html">HAR-Beobachtungen</a>
                <a href="./specification.html">Zusammenfassung</a>
                <a href="./openapi.yaml">OpenAPI YAML</a>
            </nav>
        </div>
    </header>
    <main id="swagger-ui"></main>

    <script src="https://unpkg.com/swagger-ui-dist@5.34.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.34.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.addEventListener("load", function () {
            window.ui = SwaggerUIBundle({
                url: "./openapi.yaml",
                dom_id: "#swagger-ui",
                deepLinking: true,
                filter: true,
                displayRequestDuration: true,
                validatorUrl: null,
                supportedSubmitMethods: [],
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout"
            });
        });
    </script>
</body>
</html>
