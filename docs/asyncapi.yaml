asyncapi: 3.1.0
info:
  title: ChatGPT Web Streams
  version: "0.1.0"
  description: Conversation and file-processing stream messages.
defaultContentType: application/json
servers:
  chatgptWeb:
    host: chatgpt.com
    protocol: https
channels:
  conversationStream:
    address: /backend-api/f/conversation
    description: >
      POST response stream with Content-Type text/event-stream.
      Explicit SSE event names are delta and delta_encoding.
      Other events are JSON data objects identified by their type property.
    messages:
      delta:
        $ref: "#/components/messages/ConversationDelta"
      deltaEncoding:
        $ref: "#/components/messages/ConversationDeltaEncoding"
      resumeConversationToken:
        $ref: "#/components/messages/ResumeConversationToken"
      inputMessage:
        $ref: "#/components/messages/InputMessage"
      titleGeneration:
        $ref: "#/components/messages/TitleGeneration"
      messageMarker:
        $ref: "#/components/messages/MessageMarker"
      serverSteMetadata:
        $ref: "#/components/messages/ServerSteMetadata"
      messageStreamComplete:
        $ref: "#/components/messages/MessageStreamComplete"
      conversationDetailMetadata:
        $ref: "#/components/messages/ConversationDetailMetadata"
      done:
        $ref: "#/components/messages/ConversationDoneMarker"
  fileProcessingStream:
    address: /backend-api/files/process_upload_stream
    description: "Body framing: newline-delimited JSON. Content-Type: text/event-stream."
    messages:
      fileProcessing:
        $ref: "#/components/messages/FileProcessingEvent"
operations:
  receiveConversationStream:
    action: receive
    summary: Receive events from a conversation response stream
    channel:
      $ref: "#/channels/conversationStream"
    messages:
      - $ref: "#/channels/conversationStream/messages/delta"
      - $ref: "#/channels/conversationStream/messages/deltaEncoding"
      - $ref: "#/channels/conversationStream/messages/resumeConversationToken"
      - $ref: "#/channels/conversationStream/messages/inputMessage"
      - $ref: "#/channels/conversationStream/messages/titleGeneration"
      - $ref: "#/channels/conversationStream/messages/messageMarker"
      - $ref: "#/channels/conversationStream/messages/serverSteMetadata"
      - $ref: "#/channels/conversationStream/messages/messageStreamComplete"
      - $ref: "#/channels/conversationStream/messages/conversationDetailMetadata"
      - $ref: "#/channels/conversationStream/messages/done"
    bindings:
      http:
        method: POST
  receiveFileProcessingStream:
    action: receive
    summary: Receive file-processing progress events
    channel:
      $ref: "#/channels/fileProcessingStream"
    messages:
      - $ref: "#/channels/fileProcessingStream/messages/fileProcessing"
    bindings:
      http:
        method: POST
components:
  messages:
    ConversationDelta:
      name: delta
      title: Conversation delta
      summary: Incremental conversation output
      description: "Conversation delta payload."
      contentType: application/json
      x-sse-event-name: delta
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationDeltaPayload"
    ConversationDeltaEncoding:
      name: delta_encoding
      title: Delta encoding
      description: "Encoding version v1."
      contentType: application/json
      x-sse-event-name: delta_encoding
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationDeltaEncodingPayload"
    ResumeConversationToken:
      name: resume_conversation_token
      title: Conversation resume token
      description: "JSON data event with type resume_conversation_token."
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationResumeToken"
    InputMessage:
      name: input_message
      title: Input message
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationInputMessage"
    TitleGeneration:
      name: title_generation
      title: Title generation
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationTitleGeneration"
    MessageMarker:
      name: message_marker
      title: Message marker
      description: >
        JSON data event identified by its type field. Marker values: cot_token, user_visible_token, final_channel_token and last_token.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationMessageMarker"
    ServerSteMetadata:
      name: server_ste_metadata
      title: Server STE metadata
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationServerSteMetadata"
    MessageStreamComplete:
      name: message_stream_complete
      title: Message stream complete
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationMessageStreamComplete"
    ConversationDetailMetadata:
      name: conversation_detail_metadata
      title: Conversation detail metadata
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationDetailMetadata"
    ConversationDoneMarker:
      name: "[DONE]"
      title: Stream completion sentinel
      description: "Terminal marker: [DONE]."
      contentType: text/plain
      x-stream-terminator: true
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/ConversationDoneMarker"
    FileProcessingEvent:
      name: file-processing-event
      title: File processing event
      description: >
        Newline-delimited JSON event from POST /backend-api/files/process_upload_stream. Progress values: 0, 20 and 100. No progress value for file.indexing.completed.
      contentType: application/json
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          $ref: "./schemas/chat-stream-events.schema.json#/definitions/FileProcessingEvent"
