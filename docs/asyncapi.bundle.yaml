asyncapi: 3.1.0
info:
  title: ChatGPT Web Streams
  version: "0.1.0"
  description: Observed messages from the conversation and file-processing streams.
defaultContentType: application/json
servers:
  chatgptWeb:
    host: chatgpt.com
    protocol: https
channels:
  conversationStream:
    address: /backend-api/f/conversation
    description: >
      POST response stream with Content-Type text/event-stream.
      Explicit SSE event names are delta and delta_encoding.
      Other observed events are JSON data objects identified by their type property.
    messages:
      delta:
        $ref: "#/components/messages/ConversationDelta"
      deltaEncoding:
        $ref: "#/components/messages/ConversationDeltaEncoding"
      resumeConversationToken:
        $ref: "#/components/messages/ResumeConversationToken"
      inputMessage:
        $ref: "#/components/messages/InputMessage"
      titleGeneration:
        $ref: "#/components/messages/TitleGeneration"
      messageMarker:
        $ref: "#/components/messages/MessageMarker"
      serverSteMetadata:
        $ref: "#/components/messages/ServerSteMetadata"
      messageStreamComplete:
        $ref: "#/components/messages/MessageStreamComplete"
      conversationDetailMetadata:
        $ref: "#/components/messages/ConversationDetailMetadata"
      done:
        $ref: "#/components/messages/ConversationDoneMarker"
    x-har-observations:
      completeStreams: 4
      deltaEvents: 53
      deltaEncodingEvents: 4
      resumeConversationTokenEvents: 4
      inputMessageEvents: 4
      titleGenerationEvents: 4
      messageMarkerEvents: 16
      serverSteMetadataEvents: 4
      messageStreamCompleteEvents: 4
      conversationDetailMetadataEvents: 4
      doneMarkers: 4
  fileProcessingStream:
    address: /backend-api/files/process_upload_stream
    description: Captured newline-delimited JSON body with Content-Type text/event-stream.
    messages:
      fileProcessing:
        $ref: "#/components/messages/FileProcessingEvent"
    x-har-observations:
      requestCount: 1
      observedContentType: text/event-stream
      observedBodyFraming: newline-delimited JSON
operations:
  receiveConversationStream:
    action: receive
    summary: Receive events from a conversation response stream
    channel:
      $ref: "#/channels/conversationStream"
    messages:
      - $ref: "#/channels/conversationStream/messages/delta"
      - $ref: "#/channels/conversationStream/messages/deltaEncoding"
      - $ref: "#/channels/conversationStream/messages/resumeConversationToken"
      - $ref: "#/channels/conversationStream/messages/inputMessage"
      - $ref: "#/channels/conversationStream/messages/titleGeneration"
      - $ref: "#/channels/conversationStream/messages/messageMarker"
      - $ref: "#/channels/conversationStream/messages/serverSteMetadata"
      - $ref: "#/channels/conversationStream/messages/messageStreamComplete"
      - $ref: "#/channels/conversationStream/messages/conversationDetailMetadata"
      - $ref: "#/channels/conversationStream/messages/done"
    bindings:
      http:
        method: POST
  receiveFileProcessingStream:
    action: receive
    summary: Receive file-processing progress events
    channel:
      $ref: "#/channels/fileProcessingStream"
    messages:
      - $ref: "#/channels/fileProcessingStream/messages/fileProcessing"
    bindings:
      http:
        method: POST
components:
  messages:
    ConversationDelta:
      name: delta
      title: Conversation delta
      summary: Incremental conversation output
      description: Observed in four complete streams; field-level payload schema unavailable.
      contentType: application/json
      x-sse-event-name: delta
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "description": "Field-level payload schema unavailable in current observations."
          }
    ConversationDeltaEncoding:
      name: delta_encoding
      title: Delta encoding
      description: Observed in four complete streams; value v1 reported.
      contentType: application/json
      x-sse-event-name: delta_encoding
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "description": "The value v1 was observed; the complete payload structure was not captured."
          }
    ResumeConversationToken:
      name: resume_conversation_token
      title: Conversation resume token
      description: JSON data event with type resume_conversation_token.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "description": "JSON data event with type resume_conversation_token.",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "resume_conversation_token"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    InputMessage:
      name: input_message
      title: Input message
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "input_message"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    TitleGeneration:
      name: title_generation
      title: Title generation
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "title_generation"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    MessageMarker:
      name: message_marker
      title: Message marker
      description: >
        JSON data event identified by its type field. Observed marker values:
        cot_token, user_visible_token, final_channel_token and last_token.
        The marker field name is unknown.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "description": "Observed marker values include cot_token, user_visible_token, final_channel_token and last_token. The marker field name is unknown.",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "message_marker"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    ServerSteMetadata:
      name: server_ste_metadata
      title: Server STE metadata
      description: JSON data event identified by its type field; field-level schema is incomplete.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "server_ste_metadata"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    MessageStreamComplete:
      name: message_stream_complete
      title: Message stream complete
      description: JSON data event identified by its type field.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "message_stream_complete"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    ConversationDetailMetadata:
      name: conversation_detail_metadata
      title: Conversation detail metadata
      description: JSON data event identified by its type field; field-level schema is incomplete.
      contentType: application/json
      x-payload-type-field: type
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "conversation_detail_metadata"
                ]
              }
            },
            "required": [
              "type"
            ],
            "additionalProperties": true
          }
    ConversationDoneMarker:
      name: "[DONE]"
      title: Stream completion sentinel
      description: Literal terminal marker observed after the stream events.
      contentType: text/plain
      x-stream-terminator: true
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "string",
            "enum": [
              "[DONE]"
            ]
          }
    FileProcessingEvent:
      name: file-processing-event
      title: File processing event
      description: >
        Newline-delimited JSON event from the captured file processing stream.
        Progress is absent from the observed file.indexing.completed event.
      contentType: application/json
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          {
            "type": "object",
            "description": "Observed line-delimited JSON event from POST /backend-api/files/process_upload_stream.",
            "properties": {
              "file_id": {
                "type": "string",
              },
              "event": {
                "type": "string",
                "enum": [
                  "file.processing.started",
                  "file.processing.file_ready",
                  "file.indexing.completed",
                  "file.processing.completed"
                ]
              },
              "message": {
                "type": "string"
              },
              "progress": {
                "type": "number",
                "description": "Observed as 0, 20 and 100 for some events; absent from the observed file.indexing.completed event."
              },
              "extra": {
                "description": "Observed as null in the supplied example; the actual type is not established."
              }
            },
            "required": [
              "file_id",
              "event"
            ],
            "additionalProperties": true
          }
