<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AsyncAPI-Dokumentation der in HAR-Aufzeichnungen beobachteten ChatGPT-Nachrichtenströme.">
    <title>GPT – AsyncAPI / Streams</title>
    <link rel="stylesheet" href="https://unpkg.com/@asyncapi/react-component@3.2.1/styles/default.min.css">
    <style>
        html { box-sizing: border-box; }
        *, *::before, *::after { box-sizing: inherit; }
        body { margin: 0; color: #202124; background: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .site-header { background: #fff; border-bottom: 1px solid #dadce0; }
        .site-header-inner { max-width: 1600px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
        .brand { color: #202124; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .site-nav { display: flex; flex-wrap: wrap; gap: 14px; }
        .site-nav a { color: #174ea6; text-decoration: none; font-size: 14px; }
        .site-nav a[aria-current="page"] { color: #202124; font-weight: 700; }
        .notice { max-width: 1560px; margin: 16px auto 0; padding: 12px 16px; border-left: 4px solid #b06000; background: #fff8e1; line-height: 1.5; }
        #asyncapi { max-width: 1600px; margin: 0 auto; }
        @media (max-width: 720px) { .site-header-inner { align-items: flex-start; flex-direction: column; gap: 10px; } .site-nav { gap: 10px 14px; } .notice { margin: 12px; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="./index.html">GPT – API-Dokumentation</a>
            <nav class="site-nav" aria-label="Dokumentation">
                <a href="./index.html">OpenAPI / Swagger UI</a>
                <a href="./asyncapi.html" aria-current="page">AsyncAPI / Streams</a>
                <a href="./hooks.html">Browser-Hooks</a>
                <a href="./observations.html">HAR-Beobachtungen</a>
                <a href="./specification.html">Hinweise</a>
                <a href="./asyncapi.yaml">AsyncAPI YAML</a>
            </nav>
        </div>
    </header>
    <aside class="notice">
        <strong>Hinweis:</strong> Die dokumentierten Nachrichten stammen aus HAR-Beobachtungen. Nicht erfasste WebSocket-Frames werden ausdrücklich nicht als erfundene Nachrichtenschemas dargestellt.
    </aside>
    <main id="asyncapi" aria-label="AsyncAPI-Spezifikation"></main>

    <script src="https://unpkg.com/@asyncapi/react-component@3.2.1/browser/standalone/index.js"></script>
    <script>
        window.addEventListener("load", function () {
            AsyncApiStandalone.render({
                schema: {
                    url: "./asyncapi.bundle.yaml",
                    options: { method: "GET", mode: "cors" }
                },
                config: {
                    show: { sidebar: true }
                }
            }, document.getElementById("asyncapi"));
        });
    </script>
</body>
</html>
